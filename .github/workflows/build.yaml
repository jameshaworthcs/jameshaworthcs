name: README build
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
concurrency:
  group: readme-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Get Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: cache/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Update README file
        # Leave time for the commit step; the LOC cache is saved after every repository,
        # so a run that times out still keeps its progress for the next run
        timeout-minutes: 7
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py
      - name: Commit
        # Commit even if the update step failed or timed out, so the LOC cache progress isn't lost
        if: ${{ !cancelled() }}
        run: |-
          git add .
          git diff --cached --stat
          git config --global user.email "github-actions-bot@jameshaworthcs.github.io"
          git config --global user.name "jameshaworthcs/GitHub-Actions-Bot"
          git commit -m "Updated README" -a || echo "No changes to commit"
          git push
